  <style>
    :root {
      --bg: #030a10;
      --bg-deep: #010509;
      --panel: rgba(5,18,26,.90);
      --panel-soft: rgba(5,18,26,.72);
      --line: rgba(51,226,255,.16);
      --grid: rgba(51,226,255,.05);
      --cyan: #35e6ff;
      --cyan-dim: #1c7f96;
      --cyan-soft: rgba(53,230,255,.12);
      --green: #4dffb0;
      --amber: #ffcc4d;
      --red: #ff5b5b;
      --text: #d6f6ff;
      --text-dim: #6f95a3;
      --font-display: 'Orbitron', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
    }

    #map {
      position: absolute;
      inset: 52px 0 0 0;
      background: var(--bg-deep);
    }

    #hud-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 46px 46px;
    }

    #hud-scan {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.018) 0,
        rgba(255,255,255,.018) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
    }

    #hud-vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      box-shadow: inset 0 0 160px rgba(0,0,0,.75);
    }

    #top-bar {
      position: relative;
      z-index: 600;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 16px;
      background: linear-gradient(180deg, #06131a 0%, #030a10 100%);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 18px rgba(53,230,255,.10);
      white-space: nowrap;
      overflow: hidden;
    }

    #top-bar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(53,230,255,.65);
    }

    #top-bar .brand::before {
      content: "";
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.6s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: .25; }
    }

    .hud-stat {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      font-size: 11px;
    }

    .hud-stat b {
      font-size: 12.5px;
      color: var(--text);
      letter-spacing: .5px;
    }

    .hud-stat span {
      color: var(--text-dim);
      font-size: 9.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hud-sep {
      width: 1px;
      height: 26px;
      background: var(--line);
      flex: none;
    }

    #top-bar .spacer { flex: 1; }

    #top-bar .status-tag {
      font-size: 9.5px;
      letter-spacing: 2px;
      color: var(--green);
      border: 1px solid rgba(77,255,176,.4);
      padding: 3px 8px;
      text-transform: uppercase;
      background: rgba(77,255,176,.06);
    }


    /*
     * AIR VISUAL PARAMS — standalone HUD skin
     */
    .control-box {
      position: relative;
      padding: 13px 14px 12px;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          rgba(5, 20, 29, .96),
          rgba(2, 11, 17, .94)
        );
      border: 1px solid rgba(53, 230, 255, .28);
      clip-path:
        polygon(
          0 11px,
          11px 0,
          100% 0,
          100% calc(100% - 11px),
          calc(100% - 11px) 100%,
          0 100%
        );
      box-shadow:
        0 10px 28px rgba(0,0,0,.62),
        0 0 24px rgba(53,230,255,.11);
      backdrop-filter: blur(8px);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .control-box::before {
      content: "";
      position: absolute;
      left: 11px;
      right: 11px;
      top: 0;
      height: 1px;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(53,230,255,.9),
          transparent
        );
      box-shadow: 0 0 8px rgba(53,230,255,.45);
    }

    .control-box::after {
      content: "SYS // VIS";
      position: absolute;
      right: 13px;
      top: 11px;
      color: rgba(111,149,163,.55);
      font-size: 7px;
      letter-spacing: 1.4px;
      pointer-events: none;
    }

    .control-box .section-title {
      display: flex;
      align-items: center;
      margin: 0 0 12px;
      padding: 0 48px 8px 0;
      border-bottom: 1px solid rgba(53,230,255,.15);
      color: var(--cyan);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      text-shadow: 0 0 9px rgba(53,230,255,.38);
    }

    .control-box .section-title::before {
      content: "//";
      margin-right: 6px;
      color: var(--text-dim);
    }

    .control-box .small-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin: 0 0 4px;
      color: var(--text-dim);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .control-box .small-label span {
      min-width: 28px;
      margin-left: 10px;
      color: var(--cyan);
      text-align: right;
      text-shadow: 0 0 7px rgba(53,230,255,.36);
    }

    .control-box input[type="range"] {
      display: block;
      width: 100%;
      height: 16px;
      margin: 0 0 8px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .control-box input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border: 0;
      border-radius: 0;
      background:
        linear-gradient(
          90deg,
          rgba(53,230,255,.72),
          rgba(28,127,150,.45)
        );
      box-shadow: 0 0 5px rgba(53,230,255,.12);
    }

    .control-box input[type="range"]::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      margin-top: -4px;
      border: 1px solid rgba(214,246,255,.75);
      border-radius: 1px;
      background: var(--cyan);
      box-shadow:
        0 0 4px rgba(53,230,255,.95),
        0 0 10px rgba(53,230,255,.50);
      appearance: none;
      -webkit-appearance: none;
    }

    .control-box input[type="range"]::-moz-range-track {
      height: 3px;
      border: 0;
      background: rgba(28,127,150,.55);
    }

    .control-box input[type="range"]::-moz-range-progress {
      height: 3px;
      background: rgba(53,230,255,.85);
    }

    .control-box input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(214,246,255,.75);
      border-radius: 1px;
      background: var(--cyan);
      box-shadow: 0 0 9px rgba(53,230,255,.65);
    }

    .control-box button {
      display: block;
      width: 100%;
      margin: 4px 0 0;
      padding: 7px 10px;
      border: 1px solid rgba(53,230,255,.30);
      border-radius: 0;
      background: rgba(53,230,255,.055);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background .12s linear,
        border-color .12s linear,
        box-shadow .12s linear;
    }

    .control-box button:hover,
    .control-box button:focus-visible {
      outline: none;
      border-color: rgba(53,230,255,.78);
      background: rgba(53,230,255,.12);
      box-shadow:
        inset 0 0 12px rgba(53,230,255,.08),
        0 0 10px rgba(53,230,255,.13);
    }

    #air-visual-settings-panel {
      margin-top: 8px !important;
    }

    .icon-control {
      position: absolute;
      top: 72px;
      right: 16px;
      z-index: 700;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      clip-path: polygon(
        0 10px,
        10px 0,
        100% 0,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        0 100%
      );
      box-shadow:
        0 8px 24px rgba(0,0,0,.55),
        0 0 18px rgba(53,230,255,.08);
    }

    .icon-control button {
      width: 54px;
      height: 40px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .icon-control button:last-child { border-bottom: 0; }

    .icon-control button:hover {
      background: var(--cyan-soft);
      box-shadow: inset 0 0 12px rgba(53,230,255,.35);
    }

    #coord-readout {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 500;
      padding: 6px 10px;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--cyan);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      clip-path: polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    }

    #coord-readout .lbl {
      color: var(--text-dim);
      margin-right: 6px;
    }

    #kharkiv-alert {
      position: absolute;
      left: 14px;
      bottom: 52px;
      z-index: 500;
      width: 112px;
      min-height: 74px;
      padding: 9px 10px 8px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(5,20,29,.96), rgba(2,11,17,.94));
      border: 1px solid rgba(53,230,255,.26);
      clip-path: polygon(0 10px,10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
      box-shadow: 0 8px 24px rgba(0,0,0,.52), 0 0 18px rgba(53,230,255,.08);
    }

    #kharkiv-alert .alarm-kicker {
      margin-bottom: 4px;
      color: var(--text-dim);
      font-size: 7px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    #kharkiv-alert .alarm-state {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--amber);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    #kharkiv-alert .alarm-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 7px currentColor;
      flex: none;
    }

    #kharkiv-alert .alarm-meta {
      margin-top: 5px;
      color: var(--text-dim);
      font-size: 7px;
      line-height: 1.35;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    #kharkiv-alert[data-status="CLEAR"] .alarm-state {
      color: var(--green);
    }

    #kharkiv-alert[data-status="CLEAR"] {
      border-color: rgba(77,255,176,.35);
      box-shadow: 0 8px 24px rgba(0,0,0,.52), 0 0 18px rgba(77,255,176,.10);
    }

    #kharkiv-alert[data-status="AIR_ALERT"] {
      border-color: rgba(255,91,91,.58);
      background: linear-gradient(180deg, rgba(36,11,14,.97), rgba(14,5,8,.96));
      box-shadow: 0 8px 24px rgba(0,0,0,.56), 0 0 22px rgba(255,91,91,.22);
    }

    #kharkiv-alert[data-status="AIR_ALERT"] .alarm-state {
      color: #ff6969;
      text-shadow: 0 0 8px rgba(255,91,91,.50);
    }

    #kharkiv-alert[data-status="AIR_ALERT"] .alarm-dot {
      animation: alarmPulse 1.2s ease-in-out infinite;
    }

    #kharkiv-alert[data-status="NO_DATA"] .alarm-state {
      color: var(--amber);
    }

    @keyframes alarmPulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.76); }
    }

    .ruler {
      position: absolute;
      z-index: 490;
      pointer-events: none;
      color: rgba(53,230,255,.48);
      font-size: 8px;
      overflow: hidden;
    }

    #ruler-top,#ruler-bottom {
      left: 0;
      right: 0;
      height: 18px;
    }

    #ruler-top { top: 52px; }
    #ruler-bottom { bottom: 0; }

    #ruler-left,#ruler-right {
      top: 52px;
      bottom: 0;
      width: 34px;
    }

    #ruler-left { left: 0; }
    #ruler-right { right: 0; }

    .ruler .tick {
      position: absolute;
      opacity: .7;
      white-space: nowrap;
    }

    #ruler-left .tick,
    #ruler-right .tick {
      transform: rotate(-90deg);
      transform-origin: left top;
    }

    .lock-reticle {
      position: absolute;
      z-index: 10000;
      width: 70px;
      height: 70px;
      margin-left: -35px;
      margin-top: -35px;
      pointer-events: none;
      opacity: 0;
    }

    .lock-reticle-anim {
      animation: lockReticle .72s ease-out;
    }

    @keyframes lockReticle {
      0% {
        opacity: 0;
        transform: scale(1.8) rotate(-14deg);
      }
      30% { opacity: 1; }
      100% {
        opacity: 0;
        transform: scale(.88) rotate(0deg);
      }
    }

    .leaflet-control-layers,
    .leaflet-control-zoom {
      border: 1px solid var(--line) !important;
      background: var(--panel) !important;
      box-shadow: 0 0 14px rgba(53,230,255,.08) !important;
    }

    .leaflet-control-zoom a {
      color: var(--cyan) !important;
      background: rgba(0,10,16,.9) !important;
      border-bottom-color: var(--line) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: rgba(3,13,19,.97) !important;
      color: var(--text) !important;
    }

    .leaflet-popup-content-wrapper {
      border: 1px solid var(--line);
      border-radius: 2px;
      box-shadow: 0 0 24px rgba(53,230,255,.12);
    }

    .leaflet-popup-content {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 820px) {
      #top-bar {
        gap: 9px;
        padding: 0 8px;
      }

      #top-bar .brand {
        font-size: 11px;
        letter-spacing: 1px;
      }

      .hud-sep { display: none; }

      #radar,
      .ruler {
        display: none;
      }
    }
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    function tickClock() {
      const now = new Date();

      const clock =
        document.getElementById("hud-clock");

      const date =
        document.getElementById("hud-date");

      if (clock) {
        clock.textContent =
          now.toLocaleTimeString(
            "uk-UA",
            { hour12: false }
          );
      }

      if (date) {
        date.textContent =
          now.toLocaleDateString("uk-UA");
      }
    }

    tickClock();
    setInterval(tickClock, 1000);


    var map =
      L.map(
        "map",
        {
          zoomControl: true
        }
      );

    var kharkivBounds =
      L.latLngBounds(
        [
          [48.5, 34.8],
          [50.6, 38.3]
        ]
      );

    map.fitBounds(kharkivBounds);


    /*
     * BASEMAPS
     *
     * CARTO raster tiles were removed here because the public
     * endpoint can display an "API KEY REQUIRED" watermark.
     *
     * The standalone map uses public no-key tile services:
     * - Esri Dark Gray Canvas (default)
     * - Esri World Topographic
     * - OpenStreetMap
     */

    var darkBase =
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 16,
          crossOrigin: true,
          attribution:
            "Tiles &copy; Esri"
        }
      );

    var darkLabels =
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 16,
          crossOrigin: true,
          attribution:
            "Labels &copy; Esri"
        }
      );

    var dark =
      L.layerGroup([
        darkBase,
        darkLabels
      ]);

    var topo =
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 19,
          crossOrigin: true,
          attribution:
            "Tiles &copy; Esri"
        }
      );

    var osm =
      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          crossOrigin: true,
          attribution:
            "&copy; OpenStreetMap contributors"
        }
      );

    dark.addTo(map);


    /*
     * If the default dark basemap cannot load, fall back to OSM.
     */
    darkBase.on(
      "tileerror",
      function once() {
        darkBase.off(
          "tileerror",
          once
        );

        if (
          map.hasLayer(
            dark
          )
        ) {
          map.removeLayer(
            dark
          );
        }

        osm.addTo(
          map
        );
      }
    );


    /*
     * Put the basemap chooser in the top-left Leaflet stack.
     * Leaflet automatically places it below the zoom control,
     * so it no longer overlaps the AIR VIS / ALL / LIVE buttons.
     */
    L.control.layers(
      {
        "Dark Ops — Esri": dark,
        "Esri Topographic": topo,
        "OpenStreetMap": osm
      },
      null,
      {
        collapsed: true,
        position: "topleft"
      }
    ).addTo(map);


    map.on(
      "mousemove",
      function(e) {
        const lat =
          document.getElementById("coord-lat");

        const lon =
          document.getElementById("coord-lon");

        if (lat) {
          lat.textContent =
            e.latlng.lat.toFixed(4);
        }

        if (lon) {
          lon.textContent =
            e.latlng.lng.toFixed(4);
        }
      }
    );


    function renderRulers() {
      const top =
        document.getElementById("ruler-top");

      const bottom =
        document.getElementById("ruler-bottom");

      const left =
        document.getElementById("ruler-left");

      const right =
        document.getElementById("ruler-right");

      if (!top || !bottom || !left || !right) {
        return;
      }

      const size = map.getSize();
      const stepX = 130;
      const stepY = 110;
      const margin = 24;

      let horizontal = "";

      for (
        let x = margin;
        x < size.x - margin;
        x += stepX
      ) {
        const lng =
          map
            .containerPointToLatLng([x,0])
            .lng;

        horizontal +=
          '<span class="tick" style="left:' +
          x +
          'px">' +
          lng.toFixed(3) +
          "°</span>";
      }

      top.innerHTML = horizontal;
      bottom.innerHTML = horizontal;

      let leftTicks = "";
      let rightTicks = "";

      for (
        let y = margin;
        y < size.y - margin;
        y += stepY
      ) {
        const leftLat =
          map
            .containerPointToLatLng([0,y])
            .lat;

        const rightLat =
          map
            .containerPointToLatLng(
              [size.x,y]
            )
            .lat;

        leftTicks +=
          '<span class="tick" style="top:' +
          y +
          'px">' +
          leftLat.toFixed(3) +
          "°</span>";

        rightTicks +=
          '<span class="tick" style="top:' +
          y +
          'px">' +
          rightLat.toFixed(3) +
          "°</span>";
      }

      left.innerHTML = leftTicks;
      right.innerHTML = rightTicks;
    }

    map.on(
      "moveend zoomend resize",
      renderRulers
    );

    map.whenReady(renderRulers);


    function showLockReticle(containerPoint) {
      let reticle =
        document.getElementById(
          "lock-reticle"
        );

      if (!reticle) {
        reticle =
          document.createElement("div");

        reticle.id =
          "lock-reticle";

        reticle.className =
          "lock-reticle";

        reticle.innerHTML =
          '<svg width="70" height="70" viewBox="0 0 70 70">' +
          '<circle cx="35" cy="35" r="30" fill="none" stroke="#35e6ff" stroke-width="1.5" stroke-dasharray="4 3"/>' +
          '<circle cx="35" cy="35" r="14" fill="none" stroke="#35e6ff" stroke-width="1.5"/>' +
          '<line x1="35" y1="0" x2="35" y2="14" stroke="#35e6ff" stroke-width="1.5"/>' +
          '<line x1="35" y1="56" x2="35" y2="70" stroke="#35e6ff" stroke-width="1.5"/>' +
          '<line x1="0" y1="35" x2="14" y2="35" stroke="#35e6ff" stroke-width="1.5"/>' +
          '<line x1="56" y1="35" x2="70" y2="35" stroke="#35e6ff" stroke-width="1.5"/>' +
          "</svg>";

        map
          .getContainer()
          .appendChild(reticle);
      }

      reticle.style.left =
        containerPoint.x + "px";

      reticle.style.top =
        containerPoint.y + "px";

      reticle.classList.remove(
        "lock-reticle-anim"
      );

      void reticle.offsetWidth;

      reticle.classList.add(
        "lock-reticle-anim"
      );
    }



    const KHARKIV_ALARM_URL =
      "https://air-api.rc-kharkivindependence.space/api/alarm/kharkiv";

    const KHARKIV_ALARM_REFRESH_MS = 15000;
    let kharkivAlarmTimer = null;

    function formatAlarmCheckTime(value) {
      if (!value) return "updated —";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "updated —";

      return "updated " + date.toLocaleTimeString(
        "uk-UA",
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }
      );
    }

    function renderKharkivAlarm(payload) {
      const panel = document.getElementById("kharkiv-alert");
      const state = document.getElementById("kharkiv-alert-state");
      const updated = document.getElementById("kharkiv-alert-updated");

      if (!panel || !state || !updated) return;

      const status =
        payload &&
        payload.ok === true &&
        (payload.status === "AIR_ALERT" || payload.status === "CLEAR")
          ? payload.status
          : "NO_DATA";

      panel.dataset.status = status;

      state.textContent =
        status === "AIR_ALERT"
          ? "AIR ALERT"
          : status === "CLEAR"
            ? "CLEAR"
            : "NO DATA";

      updated.textContent =
        formatAlarmCheckTime(payload && payload.checked_at);
    }

    async function loadKharkivAlarm() {
      try {
        const response = await fetch(
          KHARKIV_ALARM_URL + "?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Alarm API HTTP " + response.status);
        }

        renderKharkivAlarm(await response.json());
      } catch (error) {
        console.warn("Kharkiv alarm status unavailable:", error);

        renderKharkivAlarm({
          ok: false,
          status: "NO_DATA",
          checked_at: new Date().toISOString()
        });
      }
    }

    function startKharkivAlarmPolling() {
      if (kharkivAlarmTimer !== null) {
        clearInterval(kharkivAlarmTimer);
      }

      loadKharkivAlarm();

      kharkivAlarmTimer = setInterval(
        loadKharkivAlarm,
        KHARKIV_ALARM_REFRESH_MS
      );
    }

    startKharkivAlarmPolling();

    /*
     * Compatibility placeholders for the shared AIR engine.
     * Standalone mode never displays the MINE overlays.
     */
    var clusterLayer =
      L.layerGroup();

    var heatProxy =
      L.layerGroup();
  </script>

  <script src="./air-mode.js"></script>
</body>
</html>
