<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030a10">
  <title>Мапа недоступна — AIR Map</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #030a10; color: #d6f6ff; font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
    main { max-width: 440px; border: 1px solid #1c7f96; border-radius: 6px; padding: 28px; background: #06131a; }
    .brand { color: #35e6ff; font: 12px monospace; letter-spacing: 2px; }
    h1 { font-size: 24px; line-height: 1.3; color: #ffcc4d; }
    .note { color: #a3c6cf; font-size: 14px; }
    button { min-height: 44px; border: 1px solid #35e6ff; border-radius: 3px; background: #030a10; color: #35e6ff; padding: 10px 16px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #35e6ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">AIR MAP // OFFLINE</div>
    <h1 id="title">Не вдалося завантажити мапу</h1>
    <p id="description">Перевірте підключення до інтернету та спробуйте ще раз. Поточні дані мапи не завантажено.</p>
    <p class="note" id="note">Керуйтеся офіційними повідомленнями про тривогу. Ця сторінка не показує стан повітряного простору.</p>
    <button type="button" id="retry">Спробувати ще раз</button>
  </main>
  <script>
    let language = "uk";
    try { language = localStorage.getItem("air-map-language-v1") === "en" ? "en" : "uk"; } catch (_) {}
    if (language === "en") {
      document.documentElement.lang = "en";
      document.title = "Map unavailable — AIR Map";
      document.getElementById("title").textContent = "The map could not be loaded";
      document.getElementById("description").textContent = "Check your internet connection and try again. Current map data has not been loaded.";
      document.getElementById("note").textContent = "Follow official air raid alerts. This page does not show the state of the airspace.";
      document.getElementById("retry").textContent = "Try again";
    }
    document.getElementById("retry").addEventListener("click", () => location.reload());
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
